plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.touchmirror'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.touchmirror'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
